<!DOCTYPE HTML>
<html lang='en'>
    <head>
        <meta charset='UTF-8'/>
        <link rel="stylesheet" href="styles.css"/>
        <title>Sign Up Page</title>
    </head>
    <body>
        <div class="page-wrapper">
            <div class="left-hand">
                <p class="logo-text"><img src="images/strawberry.png">Mordidinha</p>
            </div>
            <div class="right-hand">
                <div class="section description">
                    <p>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams.<br> Sign up now to get started.<br><br>You know you want to.
                    </p>
                </div>
                <div class="section form">
                    <p>Let's do this!</p>
                    <form action="#" method="get">
                        <div class="form-row">
                            <div class="form-item">
                                <label for="firstName">FIRST NAME</label>
                                <input type="text" id="firstName" name="firstName" required/>
                            </div>
                            <div class="form-item">
                                <label for="lastName">LAST NAME</label>
                                <input type="text" id="lastName" name="lastName"required/>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label for="email">EMAIL</label>
                                <input type="email" id="email" name="email" required/>
                            </div>
                            <div class="form-item">
                                <label for="phone">PHONE NUMBER</label>
                                <input type="tel" id="phone" name="phone"/>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label for="password">PASSWORD</label>
                                <input type="password" id="password" name="password" pattern="\w{6,18}" required/>
                            </div>
                            <div class="form-item">
                                <label for="confirmpassword">CONFIRM PASSWORD</label>
                                <input type="password" id="confirmpassword" name="confirmpassword" pattern="\w{6,18}" required>
                            </div>
                        </div>
                </div>
                <div class="section submit">
                    <button type="submit">Create Account</button>
                    </form>
                    <p>Already have an account? <a href="#">Log in</a></p>
                </div>
            </div>
        </div>
    </body>
    
</html>
